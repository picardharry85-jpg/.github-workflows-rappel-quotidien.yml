<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Progression</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a2e">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(160deg, #1a1a2e, #16213e);
        color: #eaeaea;
        min-height: 100vh;
        padding: 16px;
        padding-bottom: 100px;
    }
    header {
        text-align: center;
        margin-bottom: 20px;
    }
    header h1 {
        font-size: 22px;
        background: linear-gradient(90deg, #7fd1ff, #a78bfa);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }
    .level-card {
        background: rgba(255,255,255,0.05);
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 20px;
        text-align: center;
    }
    .level-badge {
        font-size: 36px;
        font-weight: bold;
        color: #7fd1ff;
    }
    .level-label {
        font-size: 13px;
        color: #aaa;
        margin-bottom: 10px;
    }
    .xp-bar-bg {
        background: rgba(255,255,255,0.1);
        border-radius: 10px;
        height: 14px;
        overflow: hidden;
        margin: 8px 0 4px 0;
    }
    .xp-bar-fill {
        background: linear-gradient(90deg, #7fd1ff, #a78bfa);
        height: 100%;
        border-radius: 10px;
        transition: width 0.4s ease;
    }
    .xp-text {
        font-size: 12px;
        color: #999;
    }
    .streak-row {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-top: 10px;
        font-size: 13px;
        color: #ffb84d;
    }
    .encouragement {
        background: rgba(127,209,255,0.1);
        border: 1px solid rgba(127,209,255,0.3);
        border-radius: 12px;
        padding: 12px;
        text-align: center;
        font-size: 14px;
        margin-bottom: 20px;
        min-height: 20px;
    }
    .section-title {
        font-size: 14px;
        color: #999;
        margin: 20px 0 10px 0;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .goal-card {
        background: rgba(255,255,255,0.05);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .goal-card.done {
        opacity: 0.5;
    }
    .goal-check {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2px solid #7fd1ff;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 16px;
        user-select: none;
    }
    .goal-check.checked {
        background: #7fd1ff;
        color: #1a1a2e;
    }
    .goal-info { flex: 1; }
    .goal-name { font-size: 15px; }
    .goal-streak { font-size: 11px; color: #ffb84d; margin-top: 2px; }
    .goal-delete {
        color: #a04545;
        font-size: 18px;
        cursor: pointer;
        padding: 4px 8px;
    }
    .empty-state {
        text-align: center;
        color: #777;
        padding: 30px 10px;
        font-size: 14px;
    }
    .fab {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(90deg, #7fd1ff, #a78bfa);
        color: #1a1a2e;
        border: none;
        border-radius: 30px;
        padding: 14px 28px;
        font-size: 15px;
        font-weight: bold;
        box-shadow: 0 4px 20px rgba(127,209,255,0.4);
        cursor: pointer;
        width: calc(100% - 32px);
        max-width: 400px;
    }
    .modal-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.6);
        align-items: center;
        justify-content: center;
        z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal {
        background: #1e1e35;
        border-radius: 16px;
        padding: 20px;
        width: calc(100% - 40px);
        max-width: 360px;
    }
    .modal h2 { font-size: 17px; margin-bottom: 14px; }
    .modal input {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #444;
        background: #14141f;
        color: #fff;
        font-size: 14px;
        margin-bottom: 12px;
    }
    .modal-buttons {
        display: flex;
        gap: 10px;
        margin-top: 10px;
    }
    .modal-buttons button {
        flex: 1;
        padding: 12px;
        border-radius: 10px;
        border: none;
        font-size: 14px;
        cursor: pointer;
    }
    .btn-cancel { background: #333; color: #ccc; }
    .btn-confirm { background: #7fd1ff; color: #1a1a2e; font-weight: bold; }
    .notif-btn {
        display: block;
        text-align: center;
        font-size: 12px;
        color: #7fd1ff;
        margin: 4px auto 0 auto;
        cursor: pointer;
        text-decoration: underline;
    }
</style>
</head>
<body>

<header>
    <h1>🎯 Progression</h1>
</header>

<div class="level-card">
    <div class="level-badge" id="levelBadge">Niveau 1</div>
    <div class="level-label" id="levelLabel">Debutant motive</div>
    <div class="xp-bar-bg"><div class="xp-bar-fill" id="xpFill" style="width:0%"></div></div>
    <div class="xp-text" id="xpText">0 / 100 XP</div>
    <div class="streak-row" id="globalStreak"></div>
    <div class="notif-btn" id="notifBtn">Activer les rappels</div>
</div>

<div class="encouragement" id="encouragement">Ajoute ton premier objectif pour commencer !</div>

<div class="section-title">Mes objectifs</div>
<div id="goalsList"></div>

<button class="fab" id="addGoalBtn">+ Nouvel objectif</button>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h2>Nouvel objectif</h2>
        <input type="text" id="newGoalName" placeholder="Ex: Faire du sport, Lire 10 pages...">
        <div class="modal-buttons">
            <button class="btn-cancel" id="cancelBtn">Annuler</button>
            <button class="btn-confirm" id="confirmBtn">Ajouter</button>
        </div>
    </div>
</div>

<script>
const STORAGE_KEY = "progression_app_data";

const encouragements = [
    "Bravo, continue comme ca ! 💪",
    "Un pas de plus vers tes objectifs !",
    "T'es sur une bonne lancee !",
    "Chaque jour compte, bien joue !",
    "La regularite paie, tu le sens ?",
    "Excellent, garde le rythme !",
    "Petit a petit, tu deviens plus fort !",
    "Ca c'est de la discipline !",
];

const relances = [
    "Alors, on s'y met aujourd'hui ?",
    "Tes objectifs t'attendent !",
    "Un petit effort aujourd'hui = une grande fierte demain.",
    "Ne casse pas ta serie, vas-y !",
];

function loadData() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
        try { return JSON.parse(raw); } catch (e) {}
    }
    return { xp: 0, goals: [], lastOpen: null };
}

function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let data = loadData();

function todayStr() {
    return new Date().toISOString().split("T")[0];
}

function getLevel(xp) {
    let level = 1;
    let threshold = 100;
    let remaining = xp;
    while (remaining >= threshold) {
        remaining -= threshold;
        level++;
        threshold = Math.round(threshold * 1.25);
    }
    return { level, current: remaining, needed: threshold };
}

const levelNames = [
    "Debutant motive", "Apprenti discipline", "Habitue serieux", "Guerrier de la routine",
    "Machine de regularite", "Legende vivante", "Maitre absolu"
];

function render() {
    const { level, current, needed } = getLevel(data.xp);
    document.getElementById("levelBadge").textContent = "Niveau " + level;
    document.getElementById("levelLabel").textContent = levelNames[Math.min(level - 1, levelNames.length - 1)];
    document.getElementById("xpFill").style.width = Math.round((current / needed) * 100) + "%";
    document.getElementById("xpText").textContent = current + " / " + needed + " XP";

    const bestStreak = data.goals.reduce((max, g) => Math.max(max, g.streak || 0), 0);
    document.getElementById("globalStreak").textContent = bestStreak > 0 ? "🔥 Meilleure serie : " + bestStreak + " jours" : "";

    const list = document.getElementById("goalsList");
    list.innerHTML = "";
    if (data.goals.length === 0) {
        list.innerHTML = '<div class="empty-state">Aucun objectif pour l\'instant.<br>Appuie sur "+ Nouvel objectif" pour commencer.</div>';
        return;
    }
    const today = todayStr();
    data.goals.forEach((goal, index) => {
        const doneToday = goal.lastDone === today;
        const card = document.createElement("div");
        card.className = "goal-card" + (doneToday ? " done" : "");
        card.innerHTML = `
            <div class="goal-check ${doneToday ? 'checked' : ''}" data-index="${index}">${doneToday ? '✓' : ''}</div>
            <div class="goal-info">
                <div class="goal-name">${goal.name}</div>
                <div class="goal-streak">${goal.streak > 0 ? '🔥 ' + goal.streak + ' jours de suite' : 'Pas encore commence'}</div>
            </div>
            <div class="goal-delete" data-delete="${index}">✕</div>
        `;
        list.appendChild(card);
    });

    document.querySelectorAll(".goal-check").forEach(el => {
        el.addEventListener("click", () => toggleGoal(parseInt(el.dataset.index)));
    });
    document.querySelectorAll(".goal-delete").forEach(el => {
        el.addEventListener("click", () => deleteGoal(parseInt(el.dataset.delete)));
    });
}

function toggleGoal(index) {
    const goal = data.goals[index];
    const today = todayStr();
    const yesterday = new Date(Date.now() - 86400000).toISOString().split("T")[0];

    if (goal.lastDone === today) {
        // Annuler exactement ce qui avait ete gagne
        data.xp = Math.max(0, data.xp - (goal.lastXpGained || 0));
        goal.streak = goal.previousStreak !== undefined ? goal.previousStreak : 0;
        goal.lastDone = goal.previousDone || null;
        goal.lastXpGained = 0;
    } else {
        goal.previousDone = goal.lastDone;
        goal.previousStreak = goal.streak || 0;
        if (goal.lastDone === yesterday) {
            goal.streak = (goal.streak || 0) + 1;
        } else {
            goal.streak = 1;
        }
        goal.lastDone = today;
        const gain = 15 + Math.min(goal.streak * 2, 30);
        data.xp += gain;
        goal.lastXpGained = gain;
        showEncouragement(encouragements[Math.floor(Math.random() * encouragements.length)]);
    }
    saveData(data);
    render();
}

function deleteGoal(index) {
    data.goals.splice(index, 1);
    saveData(data);
    render();
}

function showEncouragement(text) {
    const el = document.getElementById("encouragement");
    el.textContent = text;
}

function checkDailyReminder() {
    const today = todayStr();
    if (data.lastOpen !== today) {
        const notDoneCount = data.goals.filter(g => g.lastDone !== today).length;
        if (data.goals.length > 0 && notDoneCount > 0) {
            showEncouragement(relances[Math.floor(Math.random() * relances.length)]);
        }
        data.lastOpen = today;
        saveData(data);
    }
}

document.getElementById("addGoalBtn").addEventListener("click", () => {
    document.getElementById("modalOverlay").classList.add("open");
    document.getElementById("newGoalName").focus();
});
document.getElementById("cancelBtn").addEventListener("click", () => {
    document.getElementById("modalOverlay").classList.remove("open");
    document.getElementById("newGoalName").value = "";
});
document.getElementById("confirmBtn").addEventListener("click", () => {
    const name = document.getElementById("newGoalName").value.trim();
    if (name) {
        data.goals.push({ name, streak: 0, lastDone: null });
        saveData(data);
        render();
    }
    document.getElementById("modalOverlay").classList.remove("open");
    document.getElementById("newGoalName").value = "";
});

document.getElementById("notifBtn").addEventListener("click", () => {
    if ("Notification" in window) {
        Notification.requestPermission().then(perm => {
            if (perm === "granted") {
                document.getElementById("notifBtn").textContent = "Rappels actives ✓";
                new Notification("Progression", { body: "Les rappels sont actives !" });
            }
        });
    }
});

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
}

checkDailyReminder();
render();
</script>

</body>
</html>
